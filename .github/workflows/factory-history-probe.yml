name: BSC Historical Factory RPC Probe
on:
  push:
    branches: [research/archive-backfill-audit-20261118]
    paths:
      - .github/workflows/factory-history-probe.yml
      - scripts/probe_historical_factory.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bsc-factory-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run BSC older block read-only capability probe
        run: |
          python3 -m compileall -q scripts/probe_historical_factory.py
          python3 scripts/probe_historical_factory.py
          cat evidence/factory-probe/report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bsc-factory-rpc-${{ github.run_id }}
          path: evidence/factory-probe/
          retention-days: 30
          if-no-files-found: warn
