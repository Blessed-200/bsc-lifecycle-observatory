name: BSC RPC Group Size Diagnostic
on:
  push:
    branches: [research/bsc-v2-economic-replay-20261119]
    paths: [.github/workflows/bsc-v2-rpc-group-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Blessed-200/bsc-lifecycle-observatory
    steps:
      - name: Read a known historical 106-pair cohort for address group testing
        run: |
          gh run download 44429657456 --repo "$GH_REPO" \
            --name bsc-factory-backfill-44429657456 --dir /tmp/known-born
      - name: Probe groups of 10 and 25 on same block range
        run: |
          python3 - <<'PY'
          import gzip,json,urllib.request,time
          root='/tmp/known-born/pair_created.jsonl.gz'
          rows=[json.loads(s) for s in gzip.open(root,'rt')]
          addrs=list(dict.fromkeys(row['pool'] for row in rows))
          results={}
          for count in (10,25):
              params=[{'fromBlock':hex(134000000),'toBlock':hex(134000099),
                       'address':addrs[:count],
                       'topics':[['0x1c411e9a96e071241c2f21f7726b17ae89e3cab4c78be50e062b03a9fffbbad1',
                                  '0xd78ad95fa46c994b6551d0da85fc275fe613ce37657fb8d5e3d130840159d822']]}]
              req=urllib.request.Request('https://bsc-rpc.publicnode.com',
                    data=json.dumps({'jsonrpc':'2.0','id':3,'method':'eth_getLogs','params':params}).encode(),
                    method='POST',headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=12) as r:
                      body=json.load(r)
                  results[str(count)]={'status':'OK' if isinstance(body.get('result'),list) else 'RPC_ERROR',
                                       'count':len(body.get('result',[])) if isinstance(body.get('result'),list) else None,
                                       'rpc_error':str(body.get('error',''))[:140]}
              except Exception as exc:
                  results[str(count)]={'status':'ERROR','error':str(exc)[:200]}
              time.sleep(.5)
          print(json.dumps(results,indent=2),flush=True)
          with open('/tmp/group_diagnostic.json','w') as f:json.dump(results,f)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bsc-rpc-group-diagnostic-${{ github.run_id }}
          path: /tmp/group_diagnostic.json
          if-no-files-found: warn
