name: BSC collection health report
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bsc-health-reports
  cancel-in-progress: false
jobs:
  report:
    if: github.repository == 'Blessed-200/bsc-lifecycle-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify archive continuity and publish daily report
        run: python -m bsc_lifecycle.health --repo "$GITHUB_REPOSITORY" --out health-output --publish
      - name: Show report
        run: cat health-output/latest.txt >> "$GITHUB_STEP_SUMMARY"
