name: BSC V2 Historical Cohort Research
on:
  push:
    branches: [research/bsc-v2-economic-replay-20261119]
    paths:
      - scripts/collect_bsc_v2_cohorts.py
      - .github/workflows/bsc-v2-cohort-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        start: [134000000, 134050000, 134105000, 134160000, 134225000, 134290000, 134350000]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile research-only scanner
        run: python3 -m compileall -q scripts/collect_bsc_v2_cohorts.py
      - name: Collect on-chain history and verify log coverage
        timeout-minutes: 52
        run: |
          python3 scripts/collect_bsc_v2_cohorts.py \
            --start ${{ matrix.start }} \
            --out evidence/cohort-${{ matrix.start }}
      - name: Summarize
        if: always()
        run: |
          if test -f evidence/cohort-${{ matrix.start }}/summary.json; then
            cat evidence/cohort-${{ matrix.start }}/summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Cohort failed: do not use uncollected events as zeros.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cohort-${{ matrix.start }}-${{ github.run_id }}
          path: evidence/cohort-${{ matrix.start }}/
          retention-days: 30
          if-no-files-found: warn
