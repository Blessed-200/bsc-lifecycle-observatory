[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bsc-lifecycle-observatory"
version = "0.1.0"
description = "Read-only BSC lifecycle event collection with verifiable archives"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bsc_lifecycle = ["contracts.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PL", "RUF", "S", "ASYNC", "PT"]
ignore = [
    "PLR0913",  # many arguments are fine for explicit configuration plumbing
    "PLR2004",  # magic numbers appear in protocol constants and thresholds
    "PLR0912",
    "PLR0915",
    "PLR0911",
    "PLR0917",  # explicit keyword plumbing is intentional
    "S101",     # assert is used in tests
    "S311",     # random is used for jitter/simulation, not cryptography
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR", "B011", "PT018", "SLF001", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
